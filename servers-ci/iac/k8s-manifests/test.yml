apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke-test
  template:
    metadata:
      labels:
        app: smoke-test
    spec:
      containers:
      - name: web
        image: public.ecr.aws/docker/library/busybox:latest
        command: ["sh", "-c", "echo ok > /tmp/index.html && httpd -f -p 8080 -h /tmp"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-test
  namespace: default
spec:
  selector:
    app: smoke-test
  ports:
  - port: 80
    targetPort: 8080
