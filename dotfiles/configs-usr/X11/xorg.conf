# nvidia-settings: X configuration file generated by nvidia-settings
# nvidia-settings:  version 470.182.03

Section "ServerLayout"
        Identifier     "Layout0"
        Screen      0  "Screen0" 0 0
        InputDevice    "Keyboard0" "CoreKeyboard"
        InputDevice    "Mouse0" "CorePointer"
        Option         "Xinerama" "0"
EndSection

Section "Files"
EndSection

Section "InputDevice"
        # generated from data in "/etc/conf.d/gpm"
        Identifier     "Mouse0"
        Driver         "mouse"
        Option         "Protocol"
        Option         "Device" "/dev/input/mice"
        Option         "Emulate3Buttons" "no"
        Option         "ZAxisMapping" "4 5"
EndSection

Section "InputDevice"
        # generated from default
        Identifier     "Keyboard0"
        Driver         "kbd"
EndSection

Section "Monitor"
        # HorizSync source: edid, VertRefresh source: edid
        Identifier     "Monitor0"
        VendorName     "Unknown"
        ModelName      "Acer P166HQL"
        Option         "DPMS"
EndSection

Section "Device"
        Identifier     "Device0"
        Driver         "nvidia"
        VendorName     "NVIDIA Corporation"
        BoardName      "NVIDIA GeForce GT 710"
        Option         "Coolbits" "28"
        Option         "RegistryDwords" "PerfLevelSrc=0x2222"
        Option         "DRI" "2"
        Option         "DoubleShadow" "true"
        Option         "VariableRefresh" "true"
        Option         "SwapbuffersWait" "false"
        Option         "VSync" "true"
        Option         "TripleBuffer" "true"
        Option         "SyncToVBlank" "true"
EndSection

Section "Screen"
        Identifier     "Screen0"
        Device         "Device0"
        Monitor        "Monitor0"
        DefaultDepth    24
        Option         "Stereo" "0"
        Option         "nvidiaXineramaInfoOrder" "CRT-0"
        Option         "metamodes" "1366x768_60 +0+0 {ForceCompositionPipeline=On, ForceFullCompositionPipeline=On}"
        Option         "SLI" "Off"
        Option         "MultiGPU" "Off"
        Option         "BaseMosaic" "off"
        SubSection     "Display"
                Depth       24
        EndSubSection
EndSection

Section "Extensions"
        Option "Composite" "Enable"
        Option "GLX" "Enable"
EndSection

Section "ServerFlags"
        Option "DRI2" "true"
        Option "DisableVidModeExtension" "true"
        Option "BlankTime" "5"
        Option "StandbyTime" "5"
        Option "SuspendTime" "5"
        Option "OffTime" "5"
EndSection
