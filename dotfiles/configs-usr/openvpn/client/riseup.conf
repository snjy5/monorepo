# reference manual: https://openvpn.net/community-resources/reference-manual-for-openvpn-2-6/
client
dev tun

remote 204.13.164.252 53 # vpn01-sea.riseup.net in Seattle
proto tcp
verify-x509-name vpn01-sea name

cipher AES-256-GCM
tls-version-min 1.3

resolv-retry infinite
keepalive 10 60
nobind
verb 3

#script-security 2
#up /etc/openvpn/update-resolv-conf
#down /etc/openvpn/update-resolv-conf

remote-cert-tls server
remote-cert-eku "TLS Web Server Authentication"

# BEGIN EXCLUDE ROUTES
route 170.114.52.3 255.255.255.255 net_gateway
# END EXCLUDE ROUTES

ca /opt/riseup-vpn/vpn-ca.pem
cert /opt/riseup-vpn/cert.pem
key /opt/riseup-vpn/key.pem