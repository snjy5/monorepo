Section "Device"
	Identifier     "Device0"
	Driver         "nvidia"
	VendorName     "NVIDIA Corporation"
	BoardName      "NVIDIA GeForce GT 710"
	Option         "Coolbits" "28"
	#Option         "RegistryDwords" "PerfLevelSrc=0x2222"
	Option         "DRI" "2"
	Option         "DoubleShadow" "false"
	Option         "VariableRefresh" "false"
	Option         "SwapbuffersWait" "false"
	Option         "VSync" "false"
	Option         "TripleBuffer" "false"
	Option         "SyncToVBlank" "false"
	#Option         "RegistryDwords" "PowerMizerEnable=0x1; PerfLevelSrc=0x2222; PowerMizerDefaultAC=0x1"  # Performance settings
	#Option         "RegistryDwords" "OverrideMaxPerf=0x1"  # Force maximum performance
	#Option         "PageFlip" "true"  # Enables page flipping for better performance
	#Option         "NoFlip" "false" 
	#Option         "BackingStore" "true"  # Improves performance for certain applications
EndSection

Section "Screen"
	Identifier     "Screen0"
	Device         "Device0"
	Monitor        "Monitor0"
	DefaultDepth    24
	Option         "Stereo" "0"
	Option         "nvidiaXineramaInfoOrder" "CRT-0"
	Option         "metamodes" "1920x1080_60 +0+0 {ForceCompositionPipeline=On, ForceFullCompositionPipeline=On}"
	Option         "SLI" "Off"
	Option         "MultiGPU" "Off"
	Option         "BaseMosaic" "off"
	SubSection     "Display"
		Depth       24
	EndSubSection
EndSection

