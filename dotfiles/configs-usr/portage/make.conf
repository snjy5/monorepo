## /etc/portage/make.conf
# Set threads
J="4"

# Global USE flags
USE="${USE} gles2 wayland nvenc X initramfs -gtk-doc -hostonly -sendmail"

# ABI
ABI_X86="64 32"

# Emerge parameters
EMERGE_DEFAULT_OPTS="--quiet=n --verbose=y --ask=y --usepkg=y --with-bdeps=y 
--getbinpkgonly=y --binpkg-respect-use=n --jobs=1"

# Portage Features
FEATURES="binpkg-dostrip binpkg-docompress binpkg-multi-instance
-parallel-fetch -parallel-install -ebuild-locks -news noauto clean-logs nodoc
-sandbox -usersandbox -ipc-sandbox -mount-sandbox -network-sandbox -pid-sandbox"

# Optimise for cpu
CFLAGS="-mtune=generic -march=x86-64 -O2 -pipe"
CXXFLAGS="${CFLAGS}"

# No. of cores and load avg
MAKEOPTS="-j$J"

# Input
INPUT_DEVICES="libinput"

# Sound
ALSA_CARDS="hda-intel"

# GPU
VIDEO_CARDS="none"

# QEMU
QEMU_SOFTMMU_TARGETS="x86_64"
QEMU_USER_TARGETS="x86_64"

# Python targets
PYTHON_SINGLE_TARGET="python3_11"
PYTHON_TARGETS="python3_10 python3_11"

# This sets the language of build output to English.
LC_MESSAGES="C"

# Accept all license
ACCEPT_LICENSE="*"

# Accept only stable versions of packages
ACCEPT_KEYWORDS="amd64"

# Priority
PORTAGE_NICENESS="0"
PORTAGE_IONICE_COMMAND="ionice -c 2 -p \${PID}"

# Protect config files from being removed
CONFIG_PROTECT_MASK="/etc/"

# Disable integrity verification
PORTAGE_CHECKSUM_FILTER="-*"

# TMPDIR
PORTAGE_TMPDIR="/tmp"

# UNMERGE DELAY
CLEAN_DELAY="0"

# Binpkg opts
BINPKG_COMPRESS="xz"
BINPKG_COMPRESS_FLAGS="-9 -T0"
BINPKG_FORMAT="xpak"

# NOTE: stage was built with bindist flag enabled
PORTDIR="/var/db/repos/gentoo"
DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"
