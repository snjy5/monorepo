[old] # Old equalizer perfected for specific speakers over years
af=equalizer=f=62:width_type=o:w=3.3:g=2,equalizer=f=400:width_type=o:w=2.0:g=2,equalizer=f=1250:width_type=o:w=1.3:g=-2,equalizer=f=2830:width_type=o:w=1.0:g=-2,equalizer=f=5600:width_type=o:w=1.0:g=-2,equalizer=f=12500:width_type=o:w=1.3:g=-2

[bass] # Great for bassing around
af=equalizer=f=31:width_type=o:w=3.3:g=1
af-add=equalizer=f=62:width_type=o:w=3.3:g=1
af-add=equalizer=f=125:width_type=o:w=2.0:g=1
af-add=equalizer=f=250:width_type=o:w=1.3:g=-2.6
af-add=equalizer=f=500:width_type=o:w=1.0:g=-5.0
af-add=equalizer=f=1000:width_type=o:w=1.0:g=-10.6
af-add=equalizer=f=2000:width_type=o:w=1.3:g=-12.4
af-add=equalizer=f=4000:width_type=o:w=1.3:g=-13.3
af-add=equalizer=f=8000:width_type=o:w=1.3:g=-10.6
af-add=equalizer=f=16000:width_type=o:w=1.3:g=-6.7
af-add=aresample=resampler=soxr:sample_rate=348000
#af-add=bass=gain=3
#af-add=loudnorm=I=-16:TP=-1.5:LRA=11  

[treble] # Great for clarity and richness of the music
af=equalizer=f=31:width_type=o:w=3.3:g=2
af-add=equalizer=f=62:width_type=o:w=3.3:g=2
af-add=equalizer=f=125:width_type=o:w=2.0:g=2
af-add=equalizer=f=250:width_type=o:w=1.3:g=2
af-add=equalizer=f=500:width_type=o:w=1.0:g=2
af-add=equalizer=f=1000:width_type=o:w=1.0:g=2
af-add=equalizer=f=2000:width_type=o:w=1.3:g=2
af-add=equalizer=f=4000:width_type=o:w=1.3:g=2
af-add=equalizer=f=8000:width_type=o:w=1.3:g=2
af-add=equalizer=f=16000:width_type=o:w=1.3:g=2
af-add=aresample=resampler=soxr:sample_rate=348000
#af-add=asubboost=boost=1

[vocal] # Great for podcasts and audiobooks
af=equalizer=f=31:width_type=o:w=3.3:g=0
af-add=equalizer=f=62:width_type=o:w=3.3:g=0
af-add=equalizer=f=125:width_type=o:w=2.0:g=0
af-add=equalizer=f=250:width_type=o:w=1.3:g=0
af-add=equalizer=f=500:width_type=o:w=1.0:g=0
af-add=equalizer=f=1000:width_type=o:w=1.0:g=2
af-add=equalizer=f=2000:width_type=o:w=1.3:g=2
af-add=equalizer=f=4000:width_type=o:w=1.3:g=2
af-add=equalizer=f=8000:width_type=o:w=1.3:g=2
af-add=equalizer=f=16000:width_type=o:w=1.3:g=2
af-add=aresample=resampler=soxr:sample_rate=348000
