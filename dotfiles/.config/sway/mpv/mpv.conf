# Subtitle Settings
sub-font-size=36
sub-auto=no
sub-ass=no
embeddedfonts=yes # Use embedded fonts (if available)
slang=en,eng,en-GB,enGB,enUS,en-US # Set subtitle language to english
sub-visibility=yes
sub-use-margins
sub-color="#FFFFFFFF"
sub-border-color="#FF262626"
sub-border-size=1.5
sub-shadow-offset=1
sub-shadow-color="#33000000"
sub-spacing=0.5
blend-subtitles

# Audio track to english or japanese
alang=en,enGB,en-GB,eng,enUS,en-US,ja,jp,jpn

# Screenshot Settings
screenshot-format=png
screenshot-png-compression=1
screenshot-tag-colorspace=yes
screenshot-high-bit-depth=yes
screenshot-directory="/home/void/ALL/mpv-shots"

# yt-dlp arguments
ytdl-raw-options=ignore-errors=
ytdl-raw-options-append=no-abort-on-error=
ytdl-raw-options-append=continue=
ytdl-raw-options-append=ignore-no-formats-error=

# Resolution best
ytdl-format='bestvideo[height<=720][fps<=60]+bestaudio/best'
#ytdl-format='bestvideo+bestaudio'

# Audio
ao=pulse
audio-samplerate=348000
audio-format=float
volume=100
volume-max=200
audio-channels=2
audio-normalize-downmix=no
gapless-audio=no
#replaygain=track
replaygain=no

# soxr
audio-swresample-o=resampler=soxr
audio-pitch-correction=no

# Hide ffmpeg verbose messages
msg-level=ffmpeg=no

# Misc settings
vo=gpu
#hwdec=nvdec
#hwdec-codecs=nvdec
gpu-hwdec-interop=auto
stop-screensaver=yes # Disable xscreensaver during media playback.
prefetch-playlist=yes # Automatically prefetch/buffer files later in the playlist.
save-position-on-quit=yes
keep-open=no
ontop=yes
user-agent="Mozilla/5.0"
deband=no # Improve the quality of dark scenes and animated content
dither=no
scale=bilinear
dscale=bilinear
correct-downscaling=no
sigmoid-upscaling=no
hdr-compute-peak=no
allow-delayed-peak-detect=yes
vd-lavc-threads=4
video-sync=audio
interpolation=no
video-latency-hacks=yes
zimg-scaler=bilinear
zimg-dither=no
correct-downscaling=no
linear-downscaling=no
sigmoid-upscaling=no
load-scripts=no
framedrop=no

include=~/.config/mpv/eq.conf
profile=vocal
